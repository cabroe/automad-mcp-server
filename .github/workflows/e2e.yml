name: Live E2E

on:
  schedule:
    # Daily at 06:00 UTC — catches v2 regressions early.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Spinning up a container costs a couple of minutes, so skip PRs that
    # cannot affect the outcome (docs, changelog, the homepage). `paths`
    # applies to `pull_request` only — the nightly run always covers everything.
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'scripts/testenv.ts'
      - 'docker-compose.e2e.yml'
      - 'vitest.e2e.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# One live run per branch: a push to an open PR cancels the previous run
# instead of leaving two containers racing on the same suite.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Live E2E against automad/automad:v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Brings up docker-compose.e2e.yml, waits for the instance, creates a
      # deterministic admin, and writes .env.e2e — the same one command
      # developers run locally, so CI and local runs cannot drift apart.
      - name: Start test environment
        run: npm run e2e:up

      - name: Run live E2E tests
        run: npm run e2e:run

      - name: Dump Automad logs on failure
        if: failure()
        run: npm run e2e:logs

      - name: Tear down test environment
        if: always()
        run: npm run e2e:down
