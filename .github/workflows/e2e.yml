name: Live E2E

on:
  schedule:
    # Daily at 06:00 UTC — catches v2 regressions early.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Live E2E against automad/automad:v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Brings up docker-compose.e2e.yml, waits for the instance, creates a
      # deterministic admin, and writes .env.e2e — the same one command
      # developers run locally, so CI and local runs cannot drift apart.
      - name: Start test environment
        run: npm run e2e:up

      - name: Run live E2E tests
        run: npm run e2e:run

      - name: Dump Automad logs on failure
        if: failure()
        run: npm run e2e:logs

      - name: Tear down test environment
        if: always()
        run: npm run e2e:down
